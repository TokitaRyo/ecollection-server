services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ranking_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

  api:
    build: ./app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db